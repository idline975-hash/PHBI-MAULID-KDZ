    <script>
      // 1. Mock Vite HMR WebSocket in cloud preview environment to prevent connection failures
      (function() {
        if (typeof window === 'undefined') return;
        const NativeWS = window.WebSocket;
        if (!NativeWS) return;

        function isViteHmr(proto) {
          if (proto === 'vite-hmr') return true;
          if (Array.isArray(proto) && proto.includes('vite-hmr')) return true;
          return false;
        }

        class MockViteHmrSocket extends EventTarget {
          CONNECTING = 0; OPEN = 1; CLOSING = 2; CLOSED = 3;
          readyState = 0; url = ''; protocol = 'vite-hmr';
          extensions = ''; bufferedAmount = 0; binaryType = 'blob';
          onopen = null; onclose = null; onerror = null; onmessage = null;

          constructor(url) {
            super();
            this.url = url;
            setTimeout(() => {
              this.readyState = 1;
              const ev = new Event('open');
              this.dispatchEvent(ev);
              if (typeof this.onopen === 'function') this.onopen(ev);
            }, 0);
          }
          send() {}
          close(code, reason) {
            this.readyState = 3;
            const ev = new CloseEvent('close', { code: code || 1000, reason: reason || '', wasClean: true });
            this.dispatchEvent(ev);
            if (typeof this.onclose === 'function') this.onclose(ev);
          }
        }

        const PatchedWS = function(url, protocols) {
          if (isViteHmr(protocols)) {
            return new MockViteHmrSocket(url);
          }
          return new NativeWS(url, protocols);
        };
        PatchedWS.prototype = NativeWS.prototype;
        PatchedWS.CONNECTING = 0; PatchedWS.OPEN = 1; PatchedWS.CLOSING = 2; PatchedWS.CLOSED = 3;
        window.WebSocket = PatchedWS;

        // 2. Suppress any uncaught WebSocket close errors from Vite client
        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason && (String(e.reason.message || e.reason).includes('WebSocket closed') || String(e.reason.message || e.reason).includes('failed to connect to websocket'))) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function(e) {
          if (e && (String(e.message || '').includes('WebSocket closed') || String(e.message || '').includes('failed to connect to websocket'))) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        });
      })();

      // 3. React Refresh runtime fallback mocks
      window.$RefreshReg$ = () => {};
      window.$RefreshSig$ = () => (type) => type;
      window.__vite_plugin_react_preamble_installed__ = true;
    </script>
