<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="domeGradM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <filter id="shadowM" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full-bleed background for maskable safe-zone -->
  <rect width="512" height="512" fill="url(#bgGradM)" />

  <!-- Safe Zone Graphic (Scale 0.85 centered) -->
  <g transform="translate(256, 256) scale(0.82) translate(-256, -256)">
    <!-- Outer Ring Ornament -->
    <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGradM)" stroke-width="4" opacity="0.6" stroke-dasharray="12,8" />
    <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldGradM)" stroke-width="2" opacity="0.8" />

    <!-- 8-Pointed Star (Rub el Hizb) Backdrop -->
    <g filter="url(#shadowM)">
      <rect x="136" y="136" width="240" height="240" rx="20" fill="#044e3b" stroke="url(#goldGradM)" stroke-width="4" />
      <rect x="136" y="136" width="240" height="240" rx="20" fill="#044e3b" stroke="url(#goldGradM)" stroke-width="4" transform="rotate(45 256 256)" />
    </g>

    <!-- Inner Circle Medallion -->
    <circle cx="256" cy="256" r="135" fill="#022c22" stroke="url(#goldGradM)" stroke-width="5" />
    <circle cx="256" cy="256" r="128" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.5" />

    <!-- Mosque Dome Silhouette with Crescent Moon -->
    <g transform="translate(0, -5)" filter="url(#shadowM)">
      <path d="M 186 280 C 186 210, 256 180, 256 180 C 256 180, 326 210, 326 280 Z" fill="url(#domeGradM)" />
      <rect x="196" y="280" width="120" height="20" rx="3" fill="url(#goldGradM)" />
      <path d="M 238 280 C 238 250, 274 250, 274 280 Z" fill="#022c22" />
      <path d="M 254 180 L 254 150 L 258 150 L 258 180 Z" fill="url(#goldGradM)" />
      <path d="M 256 132 C 263 132, 269 138, 269 146 C 269 154, 263 160, 256 160 C 253 160, 250 159, 248 157 C 253 155, 257 151, 257 146 C 257 141, 253 137, 248 135 C 250 133, 253 132, 256 132 Z" fill="#fbbf24" />
    </g>

    <!-- Typography -->
    <text x="256" y="335" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="28" fill="#fbbf24" text-anchor="middle" letter-spacing="4">MAULID NABI</text>
    <text x="256" y="360" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="14" fill="#a7f3d0" text-anchor="middle" letter-spacing="3">KP. BARANI • RT 011/04</text>

    <!-- Bottom Badge -->
    <g transform="translate(186, 385)">
      <rect width="140" height="24" rx="12" fill="#065f46" stroke="#34d399" stroke-width="1.5" />
      <text x="70" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="10" fill="#ffffff" text-anchor="middle" letter-spacing="1">PORTAL KAS RESMI</text>
    </g>
  </g>
</svg>
