<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />

  <!-- Outer Ring Ornament -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.6" stroke-dasharray="12,8" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.8" />

  <!-- 8-Pointed Star (Rub el Hizb) Backdrop -->
  <g filter="url(#shadow)">
    <!-- Square 1 -->
    <rect x="136" y="136" width="240" height="240" rx="20" fill="#044e3b" stroke="url(#goldGrad)" stroke-width="4" />
    <!-- Square 2 rotated 45 deg -->
    <rect x="136" y="136" width="240" height="240" rx="20" fill="#044e3b" stroke="url(#goldGrad)" stroke-width="4" transform="rotate(45 256 256)" />
  </g>

  <!-- Inner Circle Medallion -->
  <circle cx="256" cy="256" r="135" fill="#022c22" stroke="url(#goldGrad)" stroke-width="5" />
  <circle cx="256" cy="256" r="128" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.5" />

  <!-- Mosque Dome Silhouette with Crescent Moon -->
  <g transform="translate(0, -5)" filter="url(#shadow)">
    <!-- Dome -->
    <path d="M 186 280 C 186 210, 256 180, 256 180 C 256 180, 326 210, 326 280 Z" fill="url(#domeGrad)" />
    <!-- Base building -->
    <rect x="196" y="280" width="120" height="20" rx="3" fill="url(#goldGrad)" />
    <!-- Arch Door -->
    <path d="M 238 280 C 238 250, 274 250, 274 280 Z" fill="#022c22" />

    <!-- Minaret Spire -->
    <path d="M 254 180 L 254 150 L 258 150 L 258 180 Z" fill="url(#goldGrad)" />

    <!-- Crescent Moon at Top -->
    <path d="M 256 132 C 263 132, 269 138, 269 146 C 269 154, 263 160, 256 160 C 253 160, 250 159, 248 157 C 253 155, 257 151, 257 146 C 257 141, 253 137, 248 135 C 250 133, 253 132, 256 132 Z" fill="#fbbf24" />
  </g>

  <!-- Typography -->
  <text x="256" y="335" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="28" fill="#fbbf24" text-anchor="middle" letter-spacing="4">ISRA MI'RAJ</text>
  <text x="256" y="360" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="14" fill="#a7f3d0" text-anchor="middle" letter-spacing="3">KP. BARANI • RT 011/04</text>

  <!-- Bottom Badge: PWA Standalone Indicator -->
  <g transform="translate(186, 385)">
    <rect width="140" height="24" rx="12" fill="#065f46" stroke="#34d399" stroke-width="1.5" />
    <text x="70" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="10" fill="#ffffff" text-anchor="middle" letter-spacing="1">PORTAL KAS RESMI</text>
  </g>
</svg>
